<!DOCTYPE html>

<html>
  <head>
    <title>Counter - AzTech</title>
    
    <meta charset="UTF-8" />
    <meta name='viewpoint' content="width=device-width; inital-scale=1.0" />

    <meta name='description' content="Nezeri hisse AzTech sirketi ucun nezerde tutulmus counter app." />
    <meta name='icon' type="image/png" href='#' />
    <meta name="author" content="AzTech" />

    <meta property='og:title' content="AzTech Counter" />
    <meta property='og:description' content="Nezeri hisse AzTech sirketi ucun nezerde tutulmus counter app." />
    <meta property='og:icon' type="image/png" href="#" />

    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>

  <body>
    <main class="main">
      <div class="container">
        <p id='counter'>0</p>

        <div class="buttons">
        <button id='btn-inc'><i class="fa-solid fa-plus"></i></button>
        <button id='btn-reset'><i class="fa-solid fa-rotate-left"></i></button>
        <button id='btn-dcr'><i class="fa-solid fa-minus"></i></button>
        </div>

        <div class="mode-button">
          <button id='btn-mode'><i class="fa-jelly-fill fa-regular fa-sun"></i></button>
        </div>

      </div>
    </main>

    <script src='script.js'></script>
  </body>
</html>
